<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e7" />
    <meta
      name="description"
      content="이웃한 숫자를 이어 10의 배수를 만들고 점수를 얻는 숫자 퍼즐 게임입니다."
    />
    <title>열의 수확 | 숫자 퍼즐</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="masthead">
        <div class="brand-mark" aria-hidden="true">🍎</div>
        <div>
          <p class="eyebrow">NUMBER ORCHARD <span>·</span> 01</p>
          <h1>열의 수확</h1>
        </div>
        <p class="masthead-note">숫자를 잇고<br />열을 수확하세요.</p>
      </header>

      <section class="game-layout" aria-label="열의 수확 게임">
        <div class="board-column">
          <div class="board-heading">
            <div>
              <p class="section-label">ORCHARD GRID</p>
              <h2>숫자 밭 <span>8 × 8</span></h2>
            </div>
            <p class="drag-hint">이웃한 숫자를 이어 보세요 <span aria-hidden="true">↘</span></p>
          </div>
          <div
            id="game-board"
            class="game-board"
            role="group"
            aria-label="숫자 격자. 상하좌우로 인접한 칸을 드래그해 선택하세요."
          ></div>
          <div class="board-footer">
            <span class="legend-dot" aria-hidden="true"></span>
            <p>합이 <strong>10의 배수</strong>면 점수를 얻어요</p>
          </div>
        </div>

        <aside class="score-column" aria-label="게임 상태">
          <div class="timer-panel">
            <div class="panel-label-row">
              <p class="section-label">남은 시간</p>
              <span id="game-state" class="state-label">준비</span>
            </div>
            <p id="timer" class="timer-value" role="timer" aria-label="남은 시간 1분">01:00</p>
            <div
              class="timer-track"
              role="progressbar"
              aria-label="남은 시간"
              aria-valuemin="0"
              aria-valuemax="60"
              aria-valuenow="60"
            >
              <span id="timer-progress"></span>
            </div>
          </div>

          <div class="score-panel">
            <p class="section-label">이번 판 점수</p>
            <p id="current-score" class="score-value" aria-live="polite">0</p>
            <div class="best-score-row">
              <span class="best-icon" aria-hidden="true">✳</span>
              <span>최고 점수</span>
              <strong id="best-score">0</strong>
            </div>
          </div>

          <div class="selection-panel" aria-live="polite" aria-atomic="true">
            <p class="section-label">선택 합계</p>
            <div class="selection-reading">
              <span id="selection-sum">0</span>
              <span id="selection-message">시작하고 숫자를 이어 보세요</span>
            </div>
          </div>

          <button id="start-button" class="start-button" type="button">
            <span id="start-button-label">게임 시작</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </button>
          <p class="control-note">제한 시간 1분 <span>·</span> 수확하면 사과가 아래로 내려와요</p>
        </aside>
      </section>

      <footer class="page-footer">
        <span>FIELD NOTES <strong>01—08</strong></span>
        <span>연결은 상하좌우로만 가능</span>
      </footer>
    </main>
    <div id="fireworks" class="fireworks" aria-hidden="true"></div>
  </body>
</html>
